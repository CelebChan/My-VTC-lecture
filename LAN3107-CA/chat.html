}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #bright-future-chat {
      --bf-ink: #17212b;
      --bf-muted: #6f7c89;
      --bf-faint: #eef2f5;
      --bf-line: #dce4e9;
      --bf-shell: #f7f9fa;
      --bf-white: #ffffff;
      --bf-blue: #2f6fed;
      --bf-blue-soft: #eaf1ff;
      --bf-coral: #eb7a5f;
      --bf-coral-soft: #fff0ec;
      --bf-green: #25a878;

      font-size: 14px;
      line-height: 1.45;
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
    }

    #bright-future-chat *,
    #bright-future-chat *::before,
    #bright-future-chat *::after { box-sizing: border-box; }

    #bright-future-chat .bf-window {
      min-height: 720px;
      display: grid;
      grid-template-columns: 264px minmax(0, 1fr);
      overflow: hidden;
      background: var(--bf-shell);

      box-shadow: 0 20px 48px rgba(26, 45, 61, .13);
    }

    #bright-future-chat .bf-sidebar {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 24px 20px;
      background: #162631;
      color: #f6fbfd;
    }

      display: flex;
      align-items: center;
      gap: 10px;
      color: #d8eef1;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    #bright-future-chat .bf-brand-mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: #162631;
      background: #b9e7dc;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 800;

    #bright-future-chat .bf-activity {

      border: 1px solid rgba(255,255,255,.12);

      font-size: 12px;

    }

      display: grid;
      gap: 12px;

    #bright-future-chat .bf-person {

      align-items: center;

          &lt;div class=&quot;bf-row ashley&quot;&gt;&lt;span class=&quot;bf-avatar ashley&quot; aria-hidden=&quot;true&quot;&gt;AL&lt;/span&gt;&lt;div class=&quot;bf-message-wrap&quot;&gt;&lt;p class=&quot;bf-sender&quot;&gt;Ashley&lt;/p&gt;&lt;div class=&quot;bf-bubble&quot;&gt;Hi Alex! Nice to meet you too. I&#x27;m Ashley Lam, a Facilities Officer from the campus management team. Happy staff appreciation dinner! The atmosphere here tonight is wonderful, isn&#x27;t it?&lt;/div&gt;&lt;div class=&quot;bf-meta&quot;&gt;7:43 PM&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

          &lt;div class=&quot;bf-row alex&quot;&gt;&lt;div class=&quot;bf-message-wrap&quot;&gt;&lt;div class=&quot;bf-bubble&quot;&gt;It was incredibly relaxing, thanks for asking! On Saturday, I went hiking at Dragon&#x27;s Back with a few close friends. The weather was beautiful, and the ocean view was amazing. Then on Sunday, I just had a lazy afternoon trying out a new artisan cafe in Tsim Sha Tsui. I really needed that break. How about you, Ashley? How did you spend your weekend?&lt;/div&gt;&lt;div class=&quot;bf-meta&quot;&gt;7:46 PM &lt;i data-lucide=&quot;check-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;bf-avatar alex&quot; aria-hidden=&quot;true&quot;&gt;AL&lt;/span&gt;&lt;/div&gt;

          &lt;div class=&quot;bf-row alex&quot;&gt;&lt;div class=&quot;bf-message-wrap&quot;&gt;&lt;div class=&quot;bf-bubble&quot;&gt;Wow, baking cookies sounds delicious! You should have brought some tonight! Speaking of being busy, how are things going in the Facilities department? Are you guys managing a lot of projects right now?&lt;/div&gt;&lt;div class=&quot;bf-meta&quot;&gt;7:48 PM &lt;i data-lucide=&quot;check-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;bf-avatar alex&quot; aria-hidden=&quot;true&quot;&gt;AL&lt;/span&gt;&lt;/div&gt;

          &lt;div class=&quot;bf-row alex&quot;&gt;&lt;div class=&quot;bf-message-wrap&quot;&gt;&lt;div class=&quot;bf-bubble&quot;&gt;That sounds like a massive undertaking. What has been done so far?&lt;/div&gt;&lt;div class=&quot;bf-meta&quot;&gt;7:50 PM &lt;i data-lucide=&quot;check-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;bf-avatar alex&quot; aria-hidden=&quot;true&quot;&gt;AL&lt;/span&gt;&lt;/div&gt;

          &lt;div class=&quot;bf-row alex&quot;&gt;&lt;div class=&quot;bf-message-wrap&quot;&gt;&lt;div class=&quot;bf-bubble&quot;&gt;That is wonderful to hear, Ashley! Thank you so much. By the way, speaking of workplace guidelines, have you heard about the new workplace uniform policy that the management just introduced this week?&lt;/div&gt;&lt;div class=&quot;bf-meta&quot;&gt;7:58 PM &lt;i data-lucide=&quot;check-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;bf-avatar alex&quot; aria-hidden=&quot;true&quot;&gt;AL&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;bf-row ashley&quot;&gt;&lt;span class=&quot;bf-avatar ashley&quot; aria-hidden=&quot;true&quot;&gt;AL&lt;/span&gt;&lt;div class=&quot;bf-message-wrap&quot;&gt;&lt;div class=&quot;bf-bubble&quot;&gt;Oh, I absolutely have, and to be completely honest with you, I feel quite frustrated and annoyed about it. All staff must wear the company-provided polo shirt with formal trousers or skirts, and jeans and sneakers are strictly banned. As a Facilities Officer, my job requires me to be physically active. I am constantly walking up and down the campus, climbing ladders to inspect ceilings, and moving heavy equipment in the storerooms. For me, wearing formal trousers and rigid leather shoes instead of flexible sneakers makes my daily work extremely inconvenient and uncomfortable.&lt;/div&gt;&lt;div class=&quot;bf-meta&quot;&gt;7:59 PM&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;bf-row alex&quot;&gt;&lt;div class=&quot;bf-message-wrap&quot;&gt;&lt;div class=&quot;bf-bubble&quot;&gt;Wow, I can totally see your point now, Ashley. I didn&#x27;t think about how it would affect the frontline facilities staff. However, looking at it from a Public Relations perspective, I do see some potential benefits. Having a standardized uniform creates a much more cohesive and professional brand image, especially when parents, students, and external visitors walk around our campus. It also saves employees time every morning since we don&#x27;t have to worry about what to wear!&lt;/div&gt;&lt;div class=&quot;bf-meta&quot;&gt;8:00 PM &lt;i data-lucide=&quot;check-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;bf-avatar alex&quot; aria-hidden=&quot;true&quot;&gt;AL&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;bf-row ashley&quot;&gt;&lt;span class=&quot;bf-avatar ashley&quot; aria-hidden=&quot;true&quot;&gt;AL&lt;/span&gt;&lt;div class=&quot;bf-message-wrap&quot;&gt;&lt;div class=&quot;bf-bubble&quot;&gt;I understand the professional image aspect, Alex, and I agree it works well for desk-bound staff or official receptions. But a one-size-fits-all policy just isn&#x27;t practical for operational roles. If I&#x27;m climbing a ladder in formal trousers and slippery leather shoes, it&#x27;s not just uncomfortable - it&#x27;s a real occupational safety hazard!&lt;/div&gt;&lt;div class=&quot;bf-meta&quot;&gt;8:01 PM&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;bf-row alex&quot;&gt;&lt;div class=&quot;bf-message-wrap&quot;&gt;&lt;div class=&quot;bf-bubble&quot;&gt;That makes total sense, Ashley. Safety and practicality should always come first for physical tasks. Exactly! Perhaps we could present a joint proposal to HR during the next staff meeting? We could suggest a flexible arrangement - for instance, allowing technical and operations teams to wear breathable sports polo shirts with dark sneakers, while administrative staff stick to the formal attire. What do you think?&lt;/div&gt;&lt;div class=&quot;bf-meta&quot;&gt;8:02 PM &lt;i data-lucide=&quot;check-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;bf-avatar alex&quot; aria-hidden=&quot;true&quot;&gt;AL&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;bf-row ashley&quot;&gt;&lt;span class=&quot;bf-avatar ashley&quot; aria-hidden=&quot;true&quot;&gt;AL&lt;/span&gt;&lt;div class=&quot;bf-message-wrap&quot;&gt;&lt;div class=&quot;bf-bubble&quot;&gt;That sounds like a brilliant idea! A hybrid uniform policy would balance professional branding with operational practicality. I&#x27;d really appreciate your help in raising this with management, as PR carries a lot of weight!&lt;/div&gt;&lt;div class=&quot;bf-meta&quot;&gt;8:03 PM&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
