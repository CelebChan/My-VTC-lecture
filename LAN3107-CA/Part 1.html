<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workplace Conversation - Alex Liu &amp; Ashley Lam</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #6f7c89;
      --line: #dce4e9;
      --shell: #f7f9fa;
      --white: #fff;
      --blue: #2f6fed;
      --blue-soft: #eaf1ff;
      --coral: #eb7a5f;
      --coral-soft: #fff0ec;
      --green: #25a878;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body {
      padding: 0 16px;
      color: var(--ink);
      background: #fbfcfd;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    .bf-window {
      width: 100%;
      max-width: 1024px;
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--shell);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 44px rgba(26, 45, 61, .11);
    }

    .bf-main {
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--white);
    }

    .bf-header {
      display: flex;
      align-items: center;
      min-height: 82px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--white);
    }

    .bf-header-title {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .bf-avatar-stack {
      display: flex;
      min-width: 68px;
    }

    .bf-avatar {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border: 2px solid var(--white);
      border-radius: 50%;
      font-size: 14px;
      font-weight: 700;
    }

    .bf-avatar.alex { color: #164a4b; background: #b8e6dc; }
    .bf-avatar.ashley { color: #75422f; background: #ffd0c2; }
    .bf-avatar-stack .bf-avatar + .bf-avatar { margin-left: -11px; }

    .bf-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      line-height: 1.25;
    }

    .bf-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .bf-chat {
      flex: 1;
      padding: 22px 24px 32px;
      background: #fbfcfd;
    }

    .bf-thread {
      display: grid;
      gap: 13px;
    }

    .bf-date {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0 5px;
      color: #73818d;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .bf-date:first-child { margin-top: 0; }

    .bf-date::before,
    .bf-date::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .bf-row {
      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    .bf-row.alex { justify-content: flex-end; }
    .bf-row.ashley { justify-content: flex-start; }
    .bf-row .bf-avatar { width: 28px; height: 28px; flex-basis: 28px; font-size: 12px; }

    .bf-message-wrap { max-width: min(80%, 680px); }

    .bf-sender {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .bf-row.alex .bf-sender { text-align: right; }

    .bf-bubble {
      padding: 11px 14px;
      border: 1px solid transparent;
      border-radius: 15px;
      font-size: 16px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      box-shadow: 0 2px 5px rgba(24, 43, 56, .05);
    }

    .bf-row.alex .bf-bubble {
      color: #143c55;
      background: var(--blue-soft);
      border-color: #d4e2ff;
      border-bottom-right-radius: 5px;
    }

    .bf-row.ashley .bf-bubble {
      color: #54382f;
      background: var(--coral-soft);
      border-color: #ffdcd2;
      border-bottom-left-radius: 5px;
    }

    @media (max-width: 760px) {
      body { padding: 0; }
      .bf-window { border: 0; border-radius: 0; box-shadow: none; }
      .bf-header { padding: 15px 16px; }
      .bf-chat { padding: 18px 14px 28px; }
      .bf-message-wrap { max-width: 87%; }
    }

    @media (max-width: 420px) {
      .bf-header h1 { font-size: 16px; }
      .bf-header p { font-size: 12px; }
      .bf-message-wrap { max-width: 90%; }
      .bf-bubble { padding: 10px 12px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="bf-window" aria-label="Workplace conversation">
    <section class="bf-main">
      <header class="bf-header">
        <div class="bf-header-title">
          <div class="bf-avatar-stack" aria-hidden="true">
            <span class="bf-avatar alex">A</span>
            <span class="bf-avatar ashley">B</span>
          </div>
          <div>
            <h1>Alex Liu &amp; Ashley Lam</h1>
            <p>Public Relations Officer · Facilities Officer · Bright Future Education Centre</p>
          </div>
        </div>
      </header>
      <div class="bf-chat">
        <div class="bf-thread" id="conversation" aria-label="Conversation transcript"></div>
      </div>
    </section>
  </main>
  <script>
    const parts = [
      {
        title: "Part 1",
        messages: [
          { speaker: "alex", text: "Hi, Ashley. Nice to meet you. My name is Alex Liu. I'm a Public Relations Officer at Bright Future Education Centre. It's nice to meet you. How's your evening going?" },
          { speaker: "ashley", text: "Hi, Alex. Nice to meet you too. I'm Ashley Lam. I'm a Facilities Officer here. My evening is going well, thank you. It's nice to have a chance to relax and talk with our colleagues." },
          { speaker: "alex", text: "Yes, I agree. It's good to have some time to relax after work." }
        ]
      },
      {
        title: "Part 2",
        messages: [
          { speaker: "alex", text: "By the way, what do you usually do at weekends?" },
          { speaker: "ashley", text: "At weekends, I usually go cycling or watch movies with my friends. Last weekend, I went cycling in the morning. The weather was nice, so it was very enjoyable. What about you, Alex?" },
          { speaker: "alex", text: "At weekends, I like outdoor activities. I usually go hiking or ride a bicycle. Last weekend, I went hiking with my friends. We walked for about two hours and enjoyed the views. Sometimes we also take some photos." },
          { speaker: "ashley", text: "That sounds really nice. What do you usually do when you go hiking?" },
          { speaker: "alex", text: "I usually walk and talk with my friends. We also enjoy the views and take some photos. I like hiking because it helps me relax after a busy week." },
          { speaker: "ashley", text: "I see. I think outdoor activities are a good way to relax. Maybe I should try hiking sometime." },
          { speaker: "alex", text: "Definitely. I think you would enjoy it." }
        ]
      },
      {
        title: "Part 2B",
        messages: [
          { speaker: "alex", text: "Another thing I'd like to talk about is a project in my department. We are organizing an Open Day for students and parents." },
          { speaker: "ashley", text: "Oh, that sounds interesting. What have you done so far for the Open Day?" },
          { speaker: "alex", text: "So far, we have chosen the date and prepared the main schedule. We have also contacted some teachers and prepared information for students and parents. Right now, we are preparing posters and arranging the rooms." },
          { speaker: "ashley", text: "That sounds like a lot of work. What are your plans for the coming months?" },
          { speaker: "alex", text: "In the coming months, we will invite more students and parents to join the Open Day. We will also prepare the final details and make sure everything is ready before the event." },
          { speaker: "ashley", text: "I think it will be a useful event for the school. It can help students and parents learn more about our centre." },
          { speaker: "alex", text: "Yes, that's what we hope. By the way, what is your department working on?" },
          { speaker: "ashley", text: "Our department is working on a classroom renovation project. We are improving the classrooms to make them more comfortable and useful for students." },
          { speaker: "alex", text: "Really? What have you done so far?" },
          { speaker: "ashley", text: "So far, we have checked the classrooms and planned the work. We have also started improving the lighting and arranging the furniture." },
          { speaker: "alex", text: "That sounds good. What are your plans for the coming months?" },
          { speaker: "ashley", text: "In the coming months, we will continue improving the classrooms. We also plan to replace some old furniture and make the classrooms more comfortable for students and teachers." },
          { speaker: "alex", text: "That sounds like a very useful project. I hope everything goes smoothly." }
        ]
      },
      {
        title: "Part 3",
        messages: [
          { speaker: "ashley", text: "By the way, have you heard about the new workplace uniform policy?" },
          { speaker: "alex", text: "Yes, I have. Personally speaking, I think it's a good idea. The main reason is that we often meet students and parents, so staff should look professional." },
          { speaker: "ashley", text: "I understand your point, but I'm not so sure about having a strict uniform every day." },
          { speaker: "alex", text: "Why do you think so?" },
          { speaker: "ashley", text: "I think the main problem is comfort. Some of us need to move around during work. For example, during the Open Day, staff may need to walk between different rooms and help students." },
          { speaker: "alex", text: "That's true. In my experience, comfortable clothes can make it easier to move around and work for a long time." },
          { speaker: "ashley", text: "Exactly. As a result, staff may feel more comfortable and work more easily." },
          { speaker: "alex", text: "However, I still think we need some kind of standard clothing. The main reason is that students and parents need to know who the staff are." },
          { speaker: "ashley", text: "I agree with that. I would rather have a company polo shirt instead of a full formal uniform." },
          { speaker: "alex", text: "Why a polo shirt?" },
          { speaker: "ashley", text: "Because it can still look professional, but it is more comfortable. For example, staff could wear the company polo shirt with simple trousers or jeans." },
          { speaker: "alex", text: "That's a good idea. On the one hand, a company shirt gives everyone a similar look. On the other hand, staff should also be comfortable at work." },
          { speaker: "ashley", text: "Yes, that's how I feel. My personal feeling is that the policy should give staff some choice." },
          { speaker: "alex", text: "I agree. So perhaps we can keep the company polo shirt but allow staff to choose comfortable trousers or skirts." },
          { speaker: "ashley", text: "Yes. I think that would be a good balance. We can look professional without making the policy too strict." },
          { speaker: "alex", text: "Exactly. As a result, staff can feel comfortable, while students and parents can still recognise us easily." },
          { speaker: "ashley", text: "I agree. So overall, I support the main idea, but I think the policy should be flexible." },
          { speaker: "alex", text: "And I agree with you. A professional image is important, but staff comfort is important too." }
        ]
      },
      {
        title: "Part 4",
        messages: [
          { speaker: "ashley", text: "Well, it was really nice talking with you, Alex. We talked about quite a lot tonight." },
          { speaker: "alex", text: "Yes, it was nice talking with you too, Ashley. I enjoyed our conversation." },
          { speaker: "ashley", text: "I hope your Open Day goes well." },
          { speaker: "alex", text: "Thank you. And I hope the classroom renovation goes well too." },
          { speaker: "ashley", text: "Thank you. Have a great evening." },
          { speaker: "alex", text: "You too. See you next time." }
        ]
      }
    ];

    const conversation = document.getElementById("conversation");
    const people = {
      alex: { name: "Alex", avatar: "A" },
      ashley: { name: "Ashley", avatar: "B" }
    };

    for (const part of parts) {
      const divider = document.createElement("h2");
      divider.className = "bf-date";
      divider.textContent = part.title;
      conversation.append(divider);

      for (const message of part.messages) {
        const person = people[message.speaker];
        const row = document.createElement("div");
        row.className = `bf-row ${message.speaker}`;

        const avatar = document.createElement("span");
        avatar.className = `bf-avatar ${message.speaker}`;
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = person.avatar;

        const wrap = document.createElement("div");
        wrap.className = "bf-message-wrap";

        const sender = document.createElement("p");
        sender.className = "bf-sender";
        sender.textContent = person.name;

        const bubble = document.createElement("div");
        bubble.className = "bf-bubble";
        bubble.textContent = message.text;

        wrap.append(sender, bubble);
        if (message.speaker === "ashley") row.append(avatar, wrap);
        else row.append(wrap, avatar);
        conversation.append(row);
      }
    }
  </script>
</body>
</html>
